services:
  backend:
    build: ./backend
    container_name: qual-backend
    volumes:
      - qual-data:/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: qual-frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  qual-data:
